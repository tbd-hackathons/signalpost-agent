name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed secrets files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "A .env file is committed. Remove it and rotate its keys." && exit 1
          fi
      - name: Install uv
        run: python3 -m pip install --user "uv==0.8.13" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make lint
      - run: make test
