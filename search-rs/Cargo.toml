[package]
name = "signalpost-search"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Candidate discovery for signalpost-agent: JSON Lines search over Brave, GDELT and Wikipedia with caching and rate limits"
repository = "https://github.com/tbd-hackathons/signalpost-agent"
publish = false

[lib]
name = "signalpost_search"
path = "src/lib.rs"

[[bin]]
name = "signalpost-search"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.102"
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.6", features = ["derive"] }
hex = "=0.4.3"
httpdate = "=1.0.3"
percent-encoding = "=2.3.2"
# rustls (ring backend) only: no OpenSSL, so static musl builds work.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
